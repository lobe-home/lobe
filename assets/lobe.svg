<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="LOBE — a glum little bee">
  <!-- halo: light ring for separation on dark backgrounds -->
  <circle cx="120" cy="132" r="91" fill="#fff"/>

  <!-- wings -->
  <ellipse cx="78" cy="82" rx="41" ry="23" fill="#E7EEFA" stroke="#C7D4EC" stroke-width="5" transform="rotate(-38 78 82)"/>
  <ellipse cx="162" cy="82" rx="41" ry="23" fill="#E7EEFA" stroke="#C7D4EC" stroke-width="5" transform="rotate(38 162 82)"/>

  <!-- head, no stripes -->
  <circle cx="120" cy="132" r="76" fill="#F6C445" stroke="#E2A62A" stroke-width="5"/>

  <!-- bold antennae -->
  <g fill="none" stroke="#2B2B2B" stroke-width="10" stroke-linecap="round">
    <path d="M106 64 C100 42, 82 56, 74 106"/>
    <path d="M134 64 C152 68, 183 94, 176 150"/>
  </g>
  <circle cx="74" cy="106" r="9" fill="#2B2B2B"/>
  <circle cx="176" cy="150" r="9" fill="#2B2B2B"/>

  <!-- face: bold eyes (no highlights) + flat mouth, gaze down-left -->
  <g transform="translate(-5 3)">
    <!-- closed, tired eyes: crescents drooping at the outer ends, gap in the middle -->
    <path d="M79 131 Q95 134 112 124" fill="none" stroke="#2B2B2B" stroke-width="9" stroke-linecap="round"/>
    <path d="M128 124 Q145 134 161 131" fill="none" stroke="#2B2B2B" stroke-width="9" stroke-linecap="round"/>

    <path d="M102 170 H138" fill="none" stroke="#2B2B2B" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
